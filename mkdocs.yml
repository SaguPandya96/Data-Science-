site_name: Data Science
site_description: End-to-end data science projects, plus the study material behind them.
site_url: https://SaguPandya96.github.io/Data-Science-/
repo_url: https://github.com/SaguPandya96/Data-Science-
repo_name: SaguPandya96/Data-Science-
copyright: Sagar Pandya

# docs/ is generated by scripts/build_docs.py from the READMEs in this repository.
docs_dir: docs
strict: true

theme:
  name: material
  features:
    - navigation.instant
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        # Four project READMEs carry mermaid diagrams; render them as diagrams.
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search

nav:
  - Home: index.md
  - Projects:
      - Signals in the Noise: projects/signals-in-the-noise.md
      - SupplyLens: projects/supplylens.md
      - Store revenue forecasting: projects/store-revenue-forecasting.md
      - Amazon review intelligence: projects/amazon-review-intelligence.md
      - GitHub repo recommender: projects/github-repo-recommender.md
      - Bitcoin direction forecasting: projects/crypto-forecasting.md
      - Evasion gap: projects/evasion-gap.md
      - EvalForge: projects/evalforge.md
      - AuthentiText: projects/authentitext.md
  - Study material: study.md
