name: Keel tests

on:
  push:
    branches: [master]
    paths:
      - "End to end data science project/keel-personal-agent/**"
      - ".github/workflows/keel-tests.yml"
  pull_request:
    paths:
      - "End to end data science project/keel-personal-agent/**"
      - ".github/workflows/keel-tests.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: "End to end data science project/keel-personal-agent"

jobs:
  checks:
    name: Lint, types and tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: "End to end data science project/keel-personal-agent/pyproject.toml"

      - name: Install project and development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,app,embed,transformer]"

      - name: Lint and format check
        run: python -m ruff check . && python -m ruff format --check .

      - name: Type check
        run: python -m mypy src

      - name: Run tests (scripted model, no API key)
        run: python -m pytest

  reproduce:
    # Each round reruns on its own, so the rounds are split across parallel jobs. One job
    # running all of them took about five hours on a slow runner, close to the six-hour limit.
    # The groups are balanced on the slowest timings seen so far (about 90 minutes at most).
    name: Benchmark numbers reproduce (rounds ${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: "1-10"
            rounds: "4 5 6 7 8 9 10"
            tests: tests/test_rerank.py
          - group: "11-12"
            rounds: "11 12"
            tests: tests/test_transformer.py
          - group: "13-14"
            rounds: "13 14"
          - group: "15"
            rounds: "15"
    env:
      KEEL_MODEL_DIR: ~/.cache/keel/models
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: "End to end data science project/keel-personal-agent/pyproject.toml"

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,embed,transformer]"

      - name: Free disk space for the models
        # Rounds 13 and 14 keep about 12 GB of models on disk. Removing toolchains this job
        # does not use (.NET, Android, Haskell) leaves room for them and the cache archive.
        working-directory: .
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
          df -h /

      - name: Restore downloaded encoders
        # Keyed on the pinned checksums. Each model sits in a folder named after its own
        # checksum, so falling back to an older cache is safe: a changed model is still
        # downloaded fresh. Every model is pinned on Hugging Face, so a cache miss only
        # costs download time.
        uses: actions/cache@v4
        with:
          path: ~/.cache/keel/models
          key: keel-encoders-${{ matrix.group }}-${{ hashFiles('End to end data science project/keel-personal-agent/configs/eval.toml') }}
          restore-keys: keel-encoders-${{ matrix.group }}-

      - name: Rerun rounds 1 and 2, which must match exactly
        # Rounds 1 and 2 use no transformer models, so their metrics regenerate bit for bit.
        if: matrix.group == '1-10'
        run: |
          python scripts/run_benchmark.py > /dev/null
          python scripts/question_breakdown.py > /dev/null
          python scripts/run_round2.py > /dev/null
          git diff --exit-code -- reports/metrics ':!reports/metrics/*_timing.json' \
            ':!reports/metrics/round[4-9].*' ':!reports/metrics/round1[0-9].*'

      - name: Rerun rounds ${{ matrix.rounds }}
        run: |
          for round in ${{ matrix.rounds }}; do
            echo "::group::Round $round"
            python "scripts/run_round$round.py" > /dev/null
            echo "::endgroup::"
          done

      - name: Real encoders and rerankers are deterministic
        if: matrix.tests
        run: KEEL_TEST_MODEL_DIR="$HOME/.cache/keel/models" python -m pytest ${{ matrix.tests }}

      - name: Committed metrics match a fresh run
        # Every number in the README comes from these files. Rounds 4 onwards use transformer
        # models, whose last bits vary with the runner's CPU, so their decisions must match
        # exactly and their rates to within 0.5 points (scripts/check_metrics.py). Timing
        # files depend on the machine and are left out.
        run: |
          files=()
          for round in ${{ matrix.rounds }}; do
            files+=("reports/metrics/round$round.json")
          done
          python scripts/check_metrics.py "${files[@]}"
