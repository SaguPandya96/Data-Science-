name: Signals in the Noise tests

on:
  push:
    branches: [master]
    paths:
      - "End to end data science project/signals-in-the-noise-ad-traffic-investigation/**"
      - ".github/workflows/signals-in-the-noise-tests.yml"
  pull_request:
    paths:
      - "End to end data science project/signals-in-the-noise-ad-traffic-investigation/**"
      - ".github/workflows/signals-in-the-noise-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "End to end data science project/signals-in-the-noise-ad-traffic-investigation"

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: "End to end data science project/signals-in-the-noise-ad-traffic-investigation/requirements.txt"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v
