name: AuthentiText transformer throughput probe

on:
  push:
    paths:
      - "End to end data science project/AuthentiText/.github/workflows/transformer-probe.yml"
      - "End to end data science project/AuthentiText/data/metadata/transformer_train_decisions.json"
      - "End to end data science project/AuthentiText/scripts/materialize_transformer_train.py"
      - "End to end data science project/AuthentiText/scripts/probe_transformer.py"
      - "End to end data science project/AuthentiText/src/authentitext/data/transformer_train.py"
      - "End to end data science project/AuthentiText/src/authentitext/modeling/transformer_probe.py"
      - ".github/workflows/authentitext-transformer-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: transformer-probe-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: End to end data science project/AuthentiText

jobs:
  probe:
    name: Measure sealed CPU training throughput
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      PYTHONPATH: src

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: End to end data science project/AuthentiText/requirements/transformer.lock

      - name: Install the reviewed CPU environment
        run: |
          python -m pip install --upgrade pip==26.1.2
          python -m pip install \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            -r requirements/transformer.lock
          python -m pip check

      - name: Acquire only the pinned training file
        run: |
          python scripts/download_data.py \
            --manifest data/metadata/mage_development_manifest.json \
            --output-dir build/transformer-raw \
            --file train \
            --timeout 120

      - name: Rebuild the audited sanitized training partition
        run: |
          python scripts/materialize_transformer_train.py \
            --input-dir build/transformer-raw \
            --cleaned-output build/transformer-data/cleaned-train.jsonl.gz \
            --output build/transformer-data/train.jsonl.gz \
            --report build/transformer-data/materialization-report.json

      - name: Measure pinned BERT-Tiny throughput
        run: |
          python scripts/probe_transformer.py \
            --train build/transformer-data/train.jsonl.gz \
            --checkpoint-dir build/transformer-checkpoint \
            --report build/transformer-probe/report.json
          cat build/transformer-data/materialization-report.json
          cat build/transformer-probe/report.json

      - name: Upload text-free probe evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: transformer-probe-${{ github.sha }}
          path: |
            End to end data science project/AuthentiText/build/transformer-data/materialization-report.json
            End to end data science project/AuthentiText/build/transformer-probe/report.json
          if-no-files-found: error
          retention-days: 7
