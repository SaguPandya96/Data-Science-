name: AuthentiText transformer environment

on:
  push:
    paths:
      - "End to end data science project/AuthentiText/.github/workflows/transformer-environment.yml"
      - "End to end data science project/AuthentiText/requirements/transformer.in"
      - ".github/workflows/authentitext-transformer-environment.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: authentitext-transformer-environment-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: End to end data science project/AuthentiText

jobs:
  resolve:
    name: Resolve pinned transformer environment
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            End to end data science project/AuthentiText/requirements/transformer.in

      - name: Resolve direct pins
        run: |
          python -m pip install --upgrade pip==26.1.2
          python -m pip install -r requirements/transformer.in

      - name: Verify and capture environment
        run: |
          python -m pip check
          mkdir -p build/transformer-environment
          python -m pip freeze --all | LC_ALL=C sort > build/transformer-environment/transformer.lock
          python - <<'PY'
          import importlib.metadata
          import json
          import platform

          names = ("torch", "transformers", "tokenizers", "accelerate")
          report = {
              "schema_version": 1,
              "python": platform.python_version(),
              "platform": platform.platform(),
              "dependencies": {
                  name: importlib.metadata.version(name) for name in names
              },
              "pip_check": "pass",
          }
          with open(
              "build/transformer-environment/environment.json",
              "w",
              encoding="utf-8",
              newline="\n",
          ) as handle:
              json.dump(report, handle, indent=2, sort_keys=True)
              handle.write("\n")
          PY

      - name: Print resolved environment for review
        run: |
          cat build/transformer-environment/environment.json
          cat build/transformer-environment/transformer.lock

      - name: Upload resolved environment
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: transformer-environment-${{ github.sha }}
          path: |
            End to end data science project/AuthentiText/build/transformer-environment/
          if-no-files-found: error
          retention-days: 7
