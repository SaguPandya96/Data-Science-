[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "supplylens"
version = "0.1.0"
description = "Supplier delivery risk and operational decision intelligence"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "Sagar Pandya" }]
dependencies = [
  "joblib==1.4.2",
  "matplotlib==3.9.2",
  "numpy==2.1.3",
  "pandas==2.2.3",
  "plotly==5.24.1",
  "PyYAML==6.0.2",
  "scikit-learn==1.5.2",
  "scipy==1.14.1",
  "seaborn==0.13.2",
  "streamlit==1.40.2",
]

[project.optional-dependencies]
dev = [
  "jupyter==1.1.1",
  "nbclient==0.10.1",
  "nbformat==5.10.4",
  "pytest==8.3.3",
  "ruff==0.8.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

