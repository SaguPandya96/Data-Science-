# Memory benchmark settings. Fixed before the first test-split run; see docs/ANALYSIS_PLAN.md.
# Any later change must be listed in the plan's change log with the reason.

[benchmark]
seed = 20260930
personas = 200
sessions_per_persona = 12
days_between_sessions = 7
distractors_per_session = [4, 9]   # inclusive range of small-talk memories per session
update_probability = 0.45          # chance a slot changes value later in the persona's history
second_update_probability = 0.25   # chance an updated slot changes again

[retrieval]
k = 5                              # memories every arm may put in the prompt
core_max = 2                       # Keel's always-on constraints, counted inside k

[analysis]
bootstrap_resamples = 2000
confidence = 0.95
primary_metric = "clean_hit"
primary_split = "test"
baselines_to_beat = ["recent", "lexical"]
key_noise_levels = [0.0, 0.25, 0.5, 1.0]
k_sweep = [1, 3, 5, 10]

# Round 2: embedding search. Fixed before the first embedding run; see docs/ANALYSIS_PLAN.md.
[round2]
split = "holdout"                  # 16 direct + 16 indirect wordings per persona
embedding_model = "wordllama l2_supercat 256d"
weight_grid = [0.25, 0.5, 1.0, 2.0] # embedding weight in Keel's hybrid score; chosen on dev
candidate = "keel+embed"
must_beat = "keel"                 # the round 1 retriever
also_compare = ["embedding", "lexical", "recent"]
