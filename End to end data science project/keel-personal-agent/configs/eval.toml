# Memory benchmark settings. Fixed before the first test-split run; see docs/ANALYSIS_PLAN.md.
# Any later change must be listed in the plan's change log with the reason.

[benchmark]
seed = 20260930
personas = 200
sessions_per_persona = 12
days_between_sessions = 7
distractors_per_session = [4, 9]   # inclusive range of small-talk memories per session
update_probability = 0.45          # chance a slot changes value later in the persona's history
second_update_probability = 0.25   # chance an updated slot changes again

[retrieval]
k = 5                              # memories every arm may put in the prompt
core_max = 2                       # Keel's always-on constraints, counted inside k

[analysis]
bootstrap_resamples = 2000
confidence = 0.95
primary_metric = "clean_hit"
primary_split = "test"
baselines_to_beat = ["recent", "lexical"]
key_noise_levels = [0.0, 0.25, 0.5, 1.0]
k_sweep = [1, 3, 5, 10]

# Round 2: embedding search. Fixed before the first embedding run; see docs/ANALYSIS_PLAN.md.
[round2]
split = "holdout"                  # 16 direct + 16 indirect wordings per persona
embedding_model = "wordllama l2_supercat 256d"
weight_grid = [0.25, 0.5, 1.0, 2.0] # embedding weight in Keel's hybrid score; chosen on dev
candidate = "keel+embed"
must_beat = "keel"                 # the round 1 retriever
also_compare = ["embedding", "lexical", "recent"]

# Round 3: end-to-end check with a real model. Fixed before the first live run.
[live]
personas = 30
split = "holdout"                  # the round 2 held-out wordings, direct and indirect
# Amended before any run, after rounds 4 and 7 changed the agent's default; see the plan.
arms = ["recent", "lexical", "transformer", "keel+transformer", "keel+rerank", "full"]
model = "claude-opus-5-5"
effort = "low"
candidate = "keel+rerank"
must_beat = "transformer"

# Round 4: transformer sentence encoders. Fixed before any transformer run.
[round4]
split = "holdout2"                 # third held-out set, 16 direct + 16 indirect wordings
weight_grid = [0.25, 0.5, 1.0, 2.0]
candidate = "keel+transformer"
must_beat = "keel+embed"           # the current default (WordLlama)
also_compare = ["transformer", "embedding", "keel", "lexical", "recent"]

[round4.encoders.minilm]
name = "all-MiniLM-L6-v2"
url = "https://storage.googleapis.com/qdrant-fastembed/sentence-transformers-all-MiniLM-L6-v2.tar.gz"
sha256 = "2735afe656e156af64ed603dbb1c96f3cae7f937286a8feb27fff7fa979f6a77"
pooling = "mean"

[round4.encoders.bge]
name = "bge-small-en-v1.5"
url = "https://storage.googleapis.com/qdrant-fastembed/fast-bge-small-en-v1.5.tar.gz"
sha256 = "3858004b3822f64f940280874b8f2d2dc25b34a4f3eb3cdf617bdceeb21ed9ed"
pooling = "cls"

# Round 5: a wider weight grid for the MiniLM encoder. Fixed before any round 5 run.
[round5]
split = "holdout3"                 # fourth held-out set, 16 direct + 16 indirect wordings
tuning_splits = ["dev", "holdout", "holdout2"]   # all already seen; used only to choose w
weight_grid = [1.0, 2.0, 3.0, 4.0, 6.0, 8.0, 12.0, 16.0]
current_weight = 2.0
candidate = "keel+transformer(tuned)"
must_beat = "keel+transformer"     # the current default, w = 2.0
also_compare = ["transformer", "keel+embed"]

# Round 6: larger transformer encoders. Fixed before any larger encoder was run.
[round6]
split = "holdout4"                 # fifth held-out set, 16 direct + 16 indirect wordings
tuning_splits = ["dev", "holdout", "holdout2", "holdout3"]   # all already seen
weight_grid = [2.0, 4.0, 6.0, 8.0, 12.0]
current = { encoder = "minilm", weight = 6.0 }
min_gain = 0.01                    # adopt only if the 95% interval's lower bound is >= 1 point
candidate = "keel+larger"
must_beat = "keel+transformer"     # the current default: MiniLM at w = 6.0

[round6.encoders.minilm]
name = "all-MiniLM-L6-v2"
url = "https://storage.googleapis.com/qdrant-fastembed/sentence-transformers-all-MiniLM-L6-v2.tar.gz"
sha256 = "2735afe656e156af64ed603dbb1c96f3cae7f937286a8feb27fff7fa979f6a77"
pooling = "mean"

[round6.encoders.bge_base]
name = "bge-base-en-v1.5"
url = "https://storage.googleapis.com/qdrant-fastembed/fast-bge-base-en-v1.5.tar.gz"
sha256 = "b2e829f86bb0933e7d7fabce2d881f718464880c22658d189a2f70de4527d991"
pooling = "cls"

[round6.encoders.mpnet]
name = "all-mpnet-base-v2"
url = "https://storage.googleapis.com/qdrant-fastembed/fast-all-mpnet-base-v2.tar.gz"
sha256 = "e5b3307cf0e980b0f5c482a2520a902957834a7ca01c62d26cf95b623e59ac93"
pooling = "mean"

# Round 7: cross-encoder reranking. Fixed before any cross-encoder was run on benchmark text.
# The rerankers' revisions and SHA-256s were pinned on first download, before any benchmark run.
[round7]
split = "holdout5"                 # sixth held-out set, 16 direct + 16 indirect wordings
tuning_splits = ["dev", "holdout", "holdout2", "holdout3", "holdout4"]   # all already seen
first_stage = "mpnet"              # round6.encoders key: the shipped encoder, at its weight
first_stage_weight = 12.0
candidates_grid = [10, 20, 30]     # short list the cross-encoder reorders
weight_grid = [0.25, 0.5, 1.0, 2.0, 4.0]   # hybrid score + weight * cross-encoder logit
rerank_only = true                 # also try ordering the short list by the logit alone
min_gain = 0.01                    # adopt only if the 95% interval's lower bound is >= 1 point
candidate = "keel+rerank"
must_beat = "keel+larger"          # the shipped default: mpnet at w = 12.0, no reranking

[round7.rerankers.minilm_l6]
name = "ms-marco-MiniLM-L-6-v2"
files."model.onnx" = { url = "https://huggingface.co/Xenova/ms-marco-MiniLM-L-6-v2/resolve/a09144355adeed5f58c8ed011d209bf8ee5a1fec/onnx/model.onnx", sha256 = "c623d0bcb99f4622beb413eaef00cfbe5db20df9f1dd982da4b4f26022881870" }
files."tokenizer.json" = { url = "https://huggingface.co/Xenova/ms-marco-MiniLM-L-6-v2/resolve/a09144355adeed5f58c8ed011d209bf8ee5a1fec/tokenizer.json", sha256 = "d241a60d5e8f04cc1b2b3e9ef7a4921b27bf526d9f6050ab90f9267a1f9e5c66" }

[round7.rerankers.minilm_l12]
name = "ms-marco-MiniLM-L-12-v2"
files."model.onnx" = { url = "https://huggingface.co/Xenova/ms-marco-MiniLM-L-12-v2/resolve/42a4a787e30451cf9dbd09080c2a5b8dde332c1e/onnx/model.onnx", sha256 = "3a6d50ce60de831c8c68197df674eeb878d4ff34bb1aca5d1f3cb346c9075dba" }
files."tokenizer.json" = { url = "https://huggingface.co/Xenova/ms-marco-MiniLM-L-12-v2/resolve/42a4a787e30451cf9dbd09080c2a5b8dde332c1e/tokenizer.json", sha256 = "d241a60d5e8f04cc1b2b3e9ef7a4921b27bf526d9f6050ab90f9267a1f9e5c66" }
