# Memory benchmark settings. Fixed before the first test-split run; see docs/ANALYSIS_PLAN.md.
# Any later change must be listed in the plan's change log with the reason.

[benchmark]
seed = 20260930
personas = 200
sessions_per_persona = 12
days_between_sessions = 7
distractors_per_session = [4, 9]   # inclusive range of small-talk memories per session
update_probability = 0.45          # chance a slot changes value later in the persona's history
second_update_probability = 0.25   # chance an updated slot changes again

[retrieval]
k = 5                              # memories every arm may put in the prompt
core_max = 2                       # Keel's always-on constraints, counted inside k

[analysis]
bootstrap_resamples = 2000
confidence = 0.95
primary_metric = "clean_hit"
primary_split = "test"
baselines_to_beat = ["recent", "lexical"]
key_noise_levels = [0.0, 0.25, 0.5, 1.0]
k_sweep = [1, 3, 5, 10]

# Round 2: embedding search. Fixed before the first embedding run; see docs/ANALYSIS_PLAN.md.
[round2]
split = "holdout"                  # 16 direct + 16 indirect wordings per persona
embedding_model = "wordllama l2_supercat 256d"
weight_grid = [0.25, 0.5, 1.0, 2.0] # embedding weight in Keel's hybrid score; chosen on dev
candidate = "keel+embed"
must_beat = "keel"                 # the round 1 retriever
also_compare = ["embedding", "lexical", "recent"]

# Round 3: end-to-end check with a real model. Fixed before the first live run.
[live]
personas = 30
split = "holdout"                  # the round 2 held-out wordings, direct and indirect
arms = ["recent", "lexical", "embedding", "keel", "keel+embed", "full"]
model = "claude-opus-5-5"
effort = "low"
candidate = "keel+embed"
must_beat = "embedding"

# Round 4: transformer sentence encoders. Fixed before any transformer run.
[round4]
split = "holdout2"                 # third held-out set, 16 direct + 16 indirect wordings
weight_grid = [0.25, 0.5, 1.0, 2.0]
candidate = "keel+transformer"
must_beat = "keel+embed"           # the current default (WordLlama)
also_compare = ["transformer", "embedding", "keel", "lexical", "recent"]

[round4.encoders.minilm]
name = "all-MiniLM-L6-v2"
url = "https://storage.googleapis.com/qdrant-fastembed/sentence-transformers-all-MiniLM-L6-v2.tar.gz"
sha256 = "2735afe656e156af64ed603dbb1c96f3cae7f937286a8feb27fff7fa979f6a77"
pooling = "mean"

[round4.encoders.bge]
name = "bge-small-en-v1.5"
url = "https://storage.googleapis.com/qdrant-fastembed/fast-bge-small-en-v1.5.tar.gz"
sha256 = "3858004b3822f64f940280874b8f2d2dc25b34a4f3eb3cdf617bdceeb21ed9ed"
pooling = "cls"
