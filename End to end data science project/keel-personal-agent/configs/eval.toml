first_stage_weight = 12.0
candidates_grid = [10, 20, 30]     # short list the cross-encoder reorders
weight_grid = [0.25, 0.5, 1.0, 2.0, 4.0]   # hybrid score + weight * cross-encoder logit
rerank_only = true                 # also try ordering the short list by the logit alone
min_gain = 0.01                    # adopt only if the 95% interval's lower bound is >= 1 point
candidate = "keel+rerank"
must_beat = "keel+larger"          # the shipped default: mpnet at w = 12.0, no reranking

