services:
  authentitext:
    build:
      context: .
      dockerfile: Dockerfile
    image: authentitext:local
    environment:
      AUTHENTITEXT_ROOT: /app
    ports:
      - "${AUTHENTITEXT_PORT:-8000}:8000"
    volumes:
      - ./artifacts/baselines/id:/app/artifacts/baselines/id:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
