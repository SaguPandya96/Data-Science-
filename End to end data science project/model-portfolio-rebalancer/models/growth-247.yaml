model: growth-247
version: 1
description: Growth 24/7. 60% equities, 30% crypto, 10% cash.
base_currency: USD
cash_floor: 0.02
sleeves:
  - id: us_large_cap
    target: 0.45
    band: {abs: 0.03, rel: 0.20}
    instruments:
      regular: [VOO]
      overnight: [VOO]
      weekend: []
    session_policy: {max_off_hours_pct: 0.25}
  - id: intl_equity
    target: 0.15
    band: {abs: 0.02, rel: 0.20}
    instruments: {regular: [VXUS], overnight: [VXUS], weekend: []}
    session_policy: {max_off_hours_pct: 0.25}
  - id: btc
    target: 0.20
    band: {abs: 0.03, rel: 0.15}
    instruments: {any: [BTC-USD]}
  - id: eth
    target: 0.10
    band: {abs: 0.02, rel: 0.20}
    instruments: {any: [ETH-USD]}
  - id: cash
    target: 0.10
    band: {abs: 0.03}
    instruments: {any: [USD, USDC]}
