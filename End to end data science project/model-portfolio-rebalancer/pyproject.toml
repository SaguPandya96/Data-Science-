[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rebalancer"
version = "0.1.0"
description = "Keeps accounts on their model portfolios around the clock, across equity and crypto sessions"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { file = "LICENSE" }
authors = [{ name = "Sagar Pandya" }]
dependencies = [
  "exchange-calendars==4.13.2",
  "pandas==3.0.6",
  "PyYAML==6.0.2",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.3",
  "ruff==0.8.1",
]

[project.scripts]
rebalancer-replay = "rebalancer.replay:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["E501"]
