# Applies when this project is used as a standalone repository. Inside the parent
# Data-Science- repo this file is inert, because GitHub only reads workflows from
# .github/workflows at the repository root; the active workflow lives there.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint
        run: ruff check src tests

      - name: Run tests
        # API tests self-skip when trained artifacts aren't present, which is the case in CI
        # since the dataset isn't committed.
        run: pytest tests -v
