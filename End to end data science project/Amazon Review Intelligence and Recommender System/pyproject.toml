[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Put the project root on sys.path so `from src...` resolves under a bare `pytest`.
# Without this it only works via `python -m pytest`, which adds cwd implicitly - so
# tests pass locally and fail in CI.
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
