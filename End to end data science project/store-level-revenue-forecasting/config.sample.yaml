project_root: .
seed: 42

data:
  train_path: data/sample/train.csv
  store_path: data/sample/store.csv
  download_if_missing: false

validation:
  holdout_weeks: 3

features:
  lag_windows: [7, 30]

model:
  kind: random_forest
  name: Random Forest (sample smoke test)
  params:
    n_estimators: 40
    max_depth: 8
    min_samples_leaf: 2
    n_jobs: 1

scenarios:
  - name: Baseline
    kind: baseline
  - name: No Promotions
    kind: set_promotions
    value: 0
  - name: Full Promotions
    kind: set_promotions
    value: 1
  - name: Demand Drop -15%
    kind: scale_recent_demand
    factor: 0.85

paths:
  processed: data/processed
  models: models
  metrics: reports/metrics
  tables: reports/tables
