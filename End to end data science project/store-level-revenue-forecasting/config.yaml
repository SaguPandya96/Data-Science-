project_root: .
seed: 42

data:
  train_path: data/raw/train.csv
  store_path: data/raw/store.csv
  train_url: https://raw.githubusercontent.com/dmi3kno/Kaggle-Rossmann/master/train.csv
  store_url: https://raw.githubusercontent.com/dmi3kno/Kaggle-Rossmann/master/store.csv
  train_sha256: f6e4597c142d7d909a13d53b68a8e85c00b9a4c7b5ff40adbb37d6829cc1f4cc
  store_sha256: f56bd124a2849489e6bbb5c000f5fc9640204355e316475c918ae4d089afb344
  download_if_missing: true

validation:
  holdout_weeks: 6

features:
  lag_windows: [7, 30]

model:
  kind: xgboost
  name: XGBoost
  params:
    n_estimators: 300
    learning_rate: 0.05
    max_depth: 6
    subsample: 0.8
    colsample_bytree: 0.8
    objective: reg:squarederror
    n_jobs: -1

scenarios:
  - name: Baseline
    kind: baseline
  - name: No Promotions
    kind: set_promotions
    value: 0
  - name: Full Promotions
    kind: set_promotions
    value: 1
  - name: Demand Drop -15%
    kind: scale_recent_demand
    factor: 0.85

paths:
  processed: data/processed
  models: models
  metrics: reports/metrics
  tables: reports/tables
  figures: reports/figures
