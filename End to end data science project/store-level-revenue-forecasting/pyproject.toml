[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "store-revenue-forecasting"
version = "1.0.0"
description = "Store-level rolling sales forecasts and model-based scenario planning"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "Sagar Pandya" }]
dependencies = [
  "joblib==1.4.2",
  "numpy==2.1.3",
  "pandas==2.2.3",
  "PyYAML==6.0.2",
  "requests==2.32.3",
  "scikit-learn==1.5.2",
  "xgboost==2.1.2",
]

[project.optional-dependencies]
dev = [
  "jupyter==1.1.1",
  "pytest==8.3.3",
  "ruff==0.8.1",
]

[project.scripts]
store-revenue-forecast = "store_revenue_forecasting.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
