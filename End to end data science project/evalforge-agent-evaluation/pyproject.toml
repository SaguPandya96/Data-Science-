[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "evalforge"
version = "0.1.0"
description = "Automated evaluation and adversarial stress testing for multi-turn AI agents"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Sagar Pandya", email = "pandyasagar323@gmail.com" }]
keywords = ["llm-evaluation", "agent-evaluation", "adversarial-testing", "ai-safety"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
  "pydantic>=2.7,<3",
  "typer>=0.12,<1",
  "rich>=13.7",
  "pandas>=2.2",
  "numpy>=1.26",
  "scipy>=1.12",
  "scikit-learn>=1.4",
  "PyYAML>=6.0",
  "Jinja2>=3.1",
  "structlog>=24.1",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.35", "altair>=5.3"]
providers = ["anthropic>=0.34", "openai>=1.40"]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "pandas-stubs>=2.2",
  "types-PyYAML>=6.0",
  "jupyter>=1.0",
]

[project.scripts]
evalforge = "evalforge.cli:entrypoint"

[project.urls]
Repository = "https://github.com/SaguPandya96/Data-Science-"

[tool.hatch.build.targets.wheel]
packages = ["src/evalforge"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "N",    # pep8-naming
  "UP",   # pyupgrade
  "B",    # bugbear
  "C4",   # comprehensions
  "SIM",  # simplify
  "PTH",  # use pathlib
  "RET",  # return statements
  "ARG",  # unused arguments
  "TID",  # tidy imports
  "TRY",  # tryceratops
  "RUF",  # ruff-specific
]
ignore = [
  "TRY003",  # long messages outside exception class - readable errors matter more
  "TRY400",  # logger.exception vs logger.error - structlog usage is explicit
  "B008",    # typer relies on function-call defaults
  "RUF012",  # ClassVar annotations not required for simple evaluator tables
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG001", "ARG002"]
"dashboard/**" = ["E402"]
# Tool _execute methods take a ToolContext by interface contract; not every tool needs it.
"src/evalforge/tools/*.py" = ["ARG002"]

[tool.ruff.lint.isort]
known-first-party = ["evalforge"]

[tool.mypy]
# python_version is deliberately NOT pinned. Pinning it to 3.11 made mypy analyse the
# *installed* dependencies' stubs under 3.11 rules even when running on 3.12, and numpy's
# stubs use 3.12 `type` statements. Letting mypy follow the running interpreter is both
# correct and what the CI matrix is actually testing.
mypy_path = "src"
packages = ["evalforge"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false
warn_no_return = true
warn_unreachable = false
strict_equality = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
  "scipy.*",
  "sklearn.*",
  "streamlit.*",
  "altair.*",
  "anthropic.*",
  "openai.*",
  "structlog.*",
  "duckdb.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# Puts the project root on sys.path so `from tests.conftest import ...` resolves.
# Without it, `python -m pytest` works (it adds the CWD) but the bare `pytest` binary
# does not — which is exactly how CI invokes it.
pythonpath = ["."]
addopts = "-q --strict-markers"
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
  "integration: end-to-end pipeline tests",
  "regression: golden-fixture regression tests",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["src/evalforge"]
branch = true

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@overload",
]
