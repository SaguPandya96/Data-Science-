# Fixed before looking at outcomes. See docs/ANALYSIS_PLAN.md.
data:
  path: data/raw/hillstrom.csv.gz
  arm_column: segment
  control_arm: No E-Mail
  treatment_arms: [Mens E-Mail, Womens E-Mail]
  expected_allocation: {No E-Mail: 0.3333, Mens E-Mail: 0.3333, Womens E-Mail: 0.3334}

experiment:
  primary_metric: visit
  secondary_metrics: [conversion, spend]
  alpha: 0.05
  power: 0.80
  srm_alpha: 0.001
  balance_smd_threshold: 0.1
  cuped_covariate: history  # past-year spend, measured before the email

uplift:
  treatment_arm: Mens E-Mail
  outcome: visit
  test_size: 0.3
  random_state: 42
  budget_fractions: [0.1, 0.2, 0.3, 0.5]
