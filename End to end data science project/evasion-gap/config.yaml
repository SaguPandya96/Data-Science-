model_id: unitary/toxic-bert

dataset:
  name: google/civil_comments
  n_toxic: 300
  n_benign: 300
  toxic_min: 0.8
  benign_max: 0.1

eval:
  batch_size: 32
  max_length: 256

  # Two thresholds are evaluated because they give different answers.
  # Pinning on recall is common in write-ups but pushes the threshold near zero
  # when the score distribution has a long lower tail. Pinning on the false
  # positive budget is closer to how a moderation system is configured.
  operating_points:
    - name: high_recall
      pin: recall
      value: 0.95
    - name: fpr_1pct
      pin: fpr
      value: 0.01

  # Threshold used for the headline numbers and the defense chart.
  reporting_operating_point: fpr_1pct

seed: 42
